[project]
name = "dooh-backend"
version = "0.1.0"
description = "DOOH platform backend: device pairing, loops, proof of play"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "httpx>=0.28.1",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "httpx2>=2.13.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
